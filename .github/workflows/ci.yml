name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          extensions: intl, mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Lint application sources
        run: find app -name "*.php" -print0 | xargs -0 -n1 php -l

      # The spark CLI router (ci(:any) catchall) is unreliable on the
      # ubuntu runner with CodeIgniter 4.0.5, so the smoke test drives
      # the built-in server directly with the framework's rewrite script.
      - name: Framework smoke test
        run: |
          php -S 127.0.0.1:8080 -t public vendor/codeigniter4/framework/system/Commands/Server/rewrite.php > serve.log 2>&1 &
          SERVER_PID=$!
          ok=false
          for i in $(seq 1 10); do
            sleep 1
            if curl --max-time 3 -s -o /dev/null http://127.0.0.1:8080/calculator; then
              ok=true
              break
            fi
          done
          kill "$SERVER_PID" 2>/dev/null || true
          cat serve.log
          $ok || { echo "::error::Calculator page did not respond with 200"; exit 1; }