name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          extensions: intl, mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Lint application sources
        run: find app -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Framework smoke test
        run: |
          php spark serve --host 127.0.0.1 --port 8080 > serve.log 2>&1 &
          SERVE_PID=$!
          ok=false
          for i in $(seq 1 10); do
            sleep 2
            if curl --max-time 3 -s -o /dev/null http://127.0.0.1:8080/calculator; then
              ok=true
              break
            fi
          done
          kill "$SERVE_PID" 2>/dev/null || true
          cat serve.log
          $ok || { echo "::error::Calculator page did not respond with 200"; exit 1; }