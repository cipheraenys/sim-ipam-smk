name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          extensions: intl, mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Lint application sources
        run: find app -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Framework smoke test
        run: |
          php spark serve --host 127.0.0.1 --port 8080 > serve.log 2>&1 &
          SERVE_PID=$!
          sleep 5
          code=$(curl --max-time 10 -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/calculator)
          echo "GET /calculator -> $code"
          kill $SERVE_PID
          test "$code" = "200"